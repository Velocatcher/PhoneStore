databaseChangeLog:
  - changeSet:
      id: 001-products
      author: you
      changes:
      - createTable:
         tableName: products
         columns:
            - column: {name: id, type: BIGSERIAL, constraints: {primaryKey: true}}
            - column: {name: sku, type: VARCHAR(64), constraints: {nullable: false, unique: true}}
            - column: {name: name, type: VARCHAR(255), constraints: {nullable: false}}
            - column: {name: brand, type: VARCHAR(128)}
            - column: {name: price, type: NUMERIC(12,2)}
            - column: {name: currency, type: VARCHAR(8)}
            - column: {name: description, type: TEXT}
  - changeSet:
      id: 002-seed
      author: you
      changes:
        - insert:
            tableName: products
            columns:
              - column: {name: sku, value: "IPH-15-128-BLK"}
              - column: {name: name, value: "iPhone 15 128GB Black"}
              - column: {name: brand, value: "Apple"}
              - column: {name: price, valueNumeric: 799.00}
              - column: {name: currency, value: "USD"}
              - column: {name: description, value: "Flagship-ish."}
        - insert:
            tableName: products
            columns:
              - column: {name: sku, value: "SMG-S24-256-GRY"}
              - column: {name: name, value: "Samsung Galaxy S24 256GB Gray"}
              - column: {name: brand, value: "Samsung"}
              - column: {name: price, valueNumeric: 899.00}
              - column: {name: currency, value: "USD"}
              - column: {name: description, value: "Also flagship. Very flagship."}