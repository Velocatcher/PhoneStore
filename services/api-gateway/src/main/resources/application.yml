server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalog
          uri: http://localhost:8082
          predicates: [Path=/api/catalog/**]
        - id: search
          uri: http://localhost:8083
          predicates: [Path=/api/search/**]
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus